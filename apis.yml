aid: agworld
url: https://raw.githubusercontent.com/api-evangelist/agworld/refs/heads/main/apis.yml
name: Agworld
kind: company
description: >-
  Agworld is a collaborative farm-management platform - now part of the Semios
  Group and majority-owned by Telus Agriculture & Consumer Goods - used by
  growers, agronomists, and ag retailers to plan, schedule, record, and report
  on field activities. The product surface covers planning, scheduling,
  precision spray records, agronomic and financial insights, and compliance
  reporting. Agworld integrates with John Deere, Climate-style monitor data
  via Agworld DBX, plus Figured, PowerBI, Shed, CalAg, Frames, CART by
  FarmReady, and Mobble. The companion DBX product is a label, manufacturer,
  ingredient, and pest database (Greenbook). Agworld does not publish an
  open public developer portal; partner integrations are arranged through
  their team.
